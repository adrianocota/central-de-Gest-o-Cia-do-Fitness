<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cia do Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#0d0d0d;--gray-50:#f7f7f7;--gray-100:#efefef;--gray-200:#e0e0e0;
  --gray-400:#aaaaaa;--gray-600:#666666;--yellow:#f5c800;
  --yellow-dim:rgba(245,200,0,0.10);--white:#ffffff;--radius:12px;--radius-sm:8px;
}
body{font-family:'Geist',system-ui,sans-serif;background:var(--white);color:var(--black);min-height:100vh;-webkit-font-smoothing:antialiased;}
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--gray-50);padding:2rem;}
.login-logo{width:180px;margin-bottom:1.25rem;}
.login-tagline{font-size:.68rem;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:#aaaaaa;margin-bottom:2.5rem;text-align:center;}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-bottom:2rem;}
.profile-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:1.5rem 1rem;display:flex;flex-direction:column;align-items:center;gap:.7rem;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .1s;user-select:none;}
.profile-card:hover{border-color:var(--black);box-shadow:0 2px 12px rgba(0,0,0,.07);}
.profile-card:active{transform:scale(0.97);}
.profile-card.admin-card{border-top:3px solid var(--yellow);}
.profile-icon{width:46px;height:46px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;}
.profile-icon svg{width:21px;height:21px;stroke:var(--gray-600);fill:none;stroke-width:1.5;}
.admin-card .profile-icon{background:var(--yellow-dim);}
.admin-card .profile-icon svg{stroke:#8a6e00;}
.profile-label{font-size:.85rem;font-weight:500;color:var(--black);text-align:center;}
.profile-sub{font-size:.7rem;color:var(--gray-400);text-align:center;line-height:1.5;}
#pin-panel{display:none;flex-direction:column;align-items:center;gap:1.4rem;animation:fadeUp .2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.pin-who{font-size:.82rem;color:var(--gray-600);text-align:center;}
.pin-who strong{color:var(--black);font-weight:500;}
.pin-dots{display:flex;gap:11px;}
.pin-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--gray-200);background:transparent;transition:background .12s,border-color .12s;}
.pin-dot.filled{background:var(--black);border-color:var(--black);}
.pin-dot.error{background:#d94040;border-color:#d94040;animation:shake .3s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pin-error{font-size:.75rem;color:#d94040;min-height:1rem;text-align:center;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:228px;}
.pin-key{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-sm);color:var(--black);font-family:'Geist',system-ui,sans-serif;font-size:1.2rem;font-weight:400;padding:.9rem 0;cursor:pointer;transition:background .1s,transform .08s;user-select:none;}
.pin-key:hover{background:var(--gray-100);}
.pin-key:active{transform:scale(0.93);background:var(--gray-200);}
.key-0{grid-column:2;}.key-del{grid-column:3;font-size:.9rem;color:var(--gray-600);}
.key-del:hover{color:var(--black);}
.back-btn{background:none;border:none;font-family:'Geist',system-ui,sans-serif;font-size:.78rem;color:var(--gray-400);cursor:pointer;padding:.4rem;transition:color .15s;}
.back-btn:hover{color:var(--black);}
#app-shell{display:none;min-height:100vh;flex-direction:column;}
.topbar{background:var(--black);height:54px;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-logo{height:30px;}
.topbar-right{display:flex;align-items:center;gap:.75rem;}
.topbar-user{font-size:.78rem;color:rgba(255,255,255,.45);}
.topbar-user b{color:rgba(255,255,255,.85);font-weight:500;}
.icon-btn{background:none;border:1px solid rgba(255,255,255,.15);border-radius:var(--radius-sm);color:rgba(255,255,255,.55);padding:5px 11px;cursor:pointer;font-size:.75rem;font-family:'Geist',system-ui,sans-serif;display:flex;align-items:center;gap:5px;transition:border-color .15s,color .15s;}
.icon-btn:hover{border-color:rgba(255,255,255,.45);color:#fff;}
.icon-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;}
.navtabs{background:var(--white);border-bottom:1px solid var(--gray-200);display:flex;padding:0 1.5rem;overflow-x:auto;}
.navtabs::-webkit-scrollbar{display:none;}
.navtab{background:none;border:none;border-bottom:2px solid transparent;padding:.85rem 1.1rem;font-family:'Geist',system-ui,sans-serif;font-size:.82rem;font-weight:400;color:var(--gray-600);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:color .15s,border-color .15s;}
.navtab:hover{color:var(--black);}
.navtab.active{color:var(--black);border-bottom-color:var(--yellow);font-weight:500;}
.navtab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;}
.app-content{flex:1;}
.module-frame{display:none;width:100%;height:calc(100vh - 54px - 42px);border:none;background:var(--white);}
.module-frame.active{display:block;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--white);border-radius:var(--radius);padding:1.75rem;width:100%;max-width:360px;display:flex;flex-direction:column;gap:1.1rem;}
.modal-title{font-size:.95rem;font-weight:500;color:var(--black);}
.modal-subtitle{font-size:.78rem;color:var(--gray-600);line-height:1.5;}
.field-label{font-size:.73rem;color:var(--gray-600);margin-bottom:4px;}
.field-group{display:flex;flex-direction:column;gap:.7rem;}
select,.pin-input{width:100%;padding:.55rem .75rem;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-family:'Geist',system-ui,sans-serif;font-size:.85rem;color:var(--black);background:var(--white);outline:none;transition:border-color .15s;-webkit-appearance:none;}
select:focus,.pin-input:focus{border-color:var(--black);}
.modal-actions{display:flex;gap:.6rem;justify-content:flex-end;}
.btn-cancel{background:none;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-family:'Geist',system-ui,sans-serif;font-size:.8rem;color:var(--gray-600);padding:.5rem 1rem;cursor:pointer;}
.btn-cancel:hover{border-color:var(--black);color:var(--black);}
.btn-save{background:var(--black);border:none;border-radius:var(--radius-sm);font-family:'Geist',system-ui,sans-serif;font-size:.8rem;color:var(--white);padding:.5rem 1rem;cursor:pointer;}
.btn-save:hover{background:#333;}
.msg-ok{font-size:.78rem;color:#1a7a3f;text-align:center;min-height:1rem;}
.msg-err{font-size:.78rem;color:#d94040;text-align:center;min-height:1rem;}
</style>
</head>

const blobUrls={};
function makeBlobUrl(id){
  if(blobUrls[id])return blobUrls[id];
  // Decodifica base64 preservando UTF-8 corretamente
  const b64=APPS_B64[id];
  const binary=atob(b64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const blob=new Blob([bytes],{type:'text/html;charset=utf-8'});
  blobUrls[id]=URL.createObjectURL(blob);
  return blobUrls[id];
}

  {id:'mila',label:'Dashboard Mila',roles:['admin','staff'],
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>'},
  {id:'banco',label:'Banco de Horas',roles:['admin'],
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>'},
  {id:'tarefas',label:'Tarefas',roles:['admin'],
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>'}
];

let currentProfile=null,selectedProfileId=null,pinBuf='',activeId=null;

function selectProfile(pid){
  selectedProfileId=pid;pinBuf='';
  document.getElementById('pin-label-name').textContent=LABELS[pid];
  document.getElementById('profile-grid').style.display='none';
  document.getElementById('pin-panel').style.display='flex';
  document.getElementById('pin-error').textContent='';
  updateDots();
}
function pk(d){if(pinBuf.length>=4)return;pinBuf+=d;updateDots();if(pinBuf.length===4)setTimeout(checkPin,100);}
function pdel(){if(!pinBuf.length)return;pinBuf=pinBuf.slice(0,-1);updateDots();document.getElementById('pin-error').textContent='';}
function updateDots(){for(let i=0;i<4;i++){const d=document.getElementById('d'+i);d.classList.remove('filled','error');if(i<pinBuf.length)d.classList.add('filled');}}
function checkPin(){
  if(pinBuf===getPin(selectedProfileId)){
    currentProfile={id:selectedProfileId,role:selectedProfileId,label:LABELS[selectedProfileId]};
    sessionStorage.setItem('cf_session',JSON.stringify(currentProfile));
    showApp();
  } else {
    for(let i=0;i<4;i++){const d=document.getElementById('d'+i);d.classList.remove('filled');d.classList.add('error');}
    document.getElementById('pin-error').textContent='PIN incorreto.';
    setTimeout(()=>{pinBuf='';updateDots();},700);
  }
}
function backToProfiles(){pinBuf='';selectedProfileId=null;document.getElementById('pin-panel').style.display='none';document.getElementById('profile-grid').style.display='grid';updateDots();}
function logout(){
  currentProfile=null;activeId=null;pinBuf='';selectedProfileId=null;
  sessionStorage.removeItem('cf_session');
  document.getElementById('pin-panel').style.display='none';
  document.getElementById('profile-grid').style.display='grid';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-shell').style.display='none';
  updateDots();
}
function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  document.getElementById('topbar-user').innerHTML='<b>'+currentProfile.label+'</b>';
  buildNav();
}
function buildNav(){
  const visible=MODULES.filter(m=>m.roles.includes(currentProfile.role));
  const nav=document.getElementById('navtabs');
  const content=document.getElementById('app-content');
  nav.innerHTML='';content.innerHTML='';
  visible.forEach((mod,i)=>{
    const btn=document.createElement('button');
    btn.className='navtab'+(i===0?' active':'');
    btn.dataset.mod=mod.id;
    btn.innerHTML=mod.icon+' '+mod.label;
    btn.onclick=()=>switchMod(mod.id);
    nav.appendChild(btn);
    const frame=document.createElement('iframe');
    frame.className='module-frame'+(i===0?' active':'');
    frame.id='mod-'+mod.id;
    frame.src=makeBlobUrl(mod.id);
    content.appendChild(frame);
  });
  activeId=visible[0]?.id;
}
function switchMod(id){
  document.querySelectorAll('.navtab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.module-frame').forEach(f=>f.classList.remove('active'));
  document.querySelector('[data-mod="'+id+'"]').classList.add('active');
  document.getElementById('mod-'+id).classList.add('active');
  activeId=id;
}
function openSettings(){
  if(currentProfile.role!=='admin'){alert('Apenas o perfil Gerencial pode alterar PINs.');return;}
  ['cfg-current','cfg-new','cfg-confirm'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('cfg-ok').textContent='';
  document.getElementById('cfg-err').textContent='';
  document.getElementById('modal-settings').classList.add('open');
}
function closeSettings(){document.getElementById('modal-settings').classList.remove('open');}
function savePin(){
  const role=document.getElementById('cfg-profile').value;
  const current=document.getElementById('cfg-current').value.trim();
  const novo=document.getElementById('cfg-new').value.trim();
  const conf=document.getElementById('cfg-confirm').value.trim();
  const errEl=document.getElementById('cfg-err');
  const okEl=document.getElementById('cfg-ok');
  errEl.textContent='';okEl.textContent='';
  if(current!==getPin('admin')){errEl.textContent='PIN gerencial incorreto.';return;}
  if(!/^\d{4}$/.test(novo)){errEl.textContent='Novo PIN deve ter 4 dígitos.';return;}
  if(novo!==conf){errEl.textContent='Os PINs não coincidem.';return;}
  setPin(role,novo);
  okEl.textContent='PIN de '+LABELS[role]+' atualizado!';
  setTimeout(closeSettings,1200);
}
(function(){
  const s=sessionStorage.getItem('cf_session');
  if(s){try{currentProfile=JSON.parse(s);showApp();}catch(e){sessionStorage.removeItem('cf_session');}}
})();
</script>
</body>
</html>
